<!-- Picker modale -->
<div class="pk-overlay" id="pk">
    <div class="pk-modal" role="dialog" aria-modal="true" aria-labelledby="pk-title">
        <div class="pk-head">
            <div class="row-between">
                <strong id="pk-title">Choisir un repas</strong>
                <button type="button" class="b-x" id="pk-close" title="Fermer" aria-label="Fermer">✕</button>
            </div>
            <input type="text" class="pk-search" id="pk-search" placeholder="🔍 Rechercher par nom…" autocomplete="off" aria-label="Rechercher une recette par nom">
            <div class="pk-filters" id="pk-nature"></div>
            <div class="pk-filters" id="pk-base"></div>
        </div>
        <div class="pk-list" id="pk-list"></div>
    </div>
</div>
