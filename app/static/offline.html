<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e67e22">
    <title>Hors ligne — Menu Planner</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: #f5f0eb;
            color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        main { max-width: 26rem; }
        img { width: 96px; height: 96px; border-radius: 20px; }
        h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
        p { line-height: 1.5; margin: .5rem 0; }
        a {
            display: inline-block;
            margin-top: 1rem;
            padding: .7rem 1.4rem;
            border-radius: 8px;
            background: #c0611a;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
        a:focus-visible { outline: 3px solid #2c3e50; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img src="/static/icon-192.png" alt="">
        <h1>Vous êtes hors ligne</h1>
        <p>Cette page n'a pas encore été consultée sur cet appareil : elle n'est pas disponible sans connexion.</p>
        <p>Les pages déjà visitées (comme la liste de courses) restent accessibles.</p>
        <a href="/">Réessayer</a>
    </main>
</body>
</html>
