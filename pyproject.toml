[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # Depends()/Form()/Query() en valeur par défaut : idiome FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]
